name: CI

on:
  pull_request:
  push:
    branches: [main]

# Copy this into your repo. It only runs scripts that exist.
# If you don't use npm, replace the Node steps with your language's equivalent.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint if present
        run: npm run lint --if-present
      - name: Test if present
        run: npm test --if-present
      - name: Build if present
        run: npm run build --if-present
