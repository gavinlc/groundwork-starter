name: CI

on:
  pull_request:
  push:
    branches: [main]

# Copy this into your repo. It only runs scripts that exist.
# If you don't use npm, replace the Node steps with your language's equivalent.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "22"

      - name: Install
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      - name: Lint if present
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present

      - name: Test if present
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Build if present
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: Nothing to run
        if: hashFiles('package.json') == ''
        run: echo "No package.json. Add one, or replace this workflow with your language."
